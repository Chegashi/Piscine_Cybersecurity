services:
  tor:
    build: ./tor
    volumes:
      - tor_keys:/var/lib/tor/hidden_service
    networks: [onion]
  nginx:
    build: ./nginx
    networks:
      onion: { ipv4_address: 172.28.0.20 }
  ssh:
    build: ./ssh
    networks:
      onion: { ipv4_address: 172.28.0.30 }
  client:
    build: ./client
    profiles: [client]
    networks: [onion]

networks:
  onion:
    ipam:
      config: [{ subnet: 172.28.0.0/16 }]

volumes:
  tor_keys:
